name: SOL V8 historical Coinalyze bv vs Binance taker reconciliation

# Separate experiment, retrospective archives, NO ORDERS or signal gates.
on:
  push:
    branches:
      - experiment/v8-sol-derivatives-probe-20261110
    paths:
      - sol_v8_bv_taker_reconciliation.py
      - tests/test_sol_v8_bv_taker_reconciliation.py
      - .github/workflows/sol-v8-bv-taker-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-v8-bv-binance-research
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated V8 experiment
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Run offline anti-leakage and discrepancy tests
        run: python3 -m unittest discover -s tests -p 'test_sol_v8_bv_taker_reconciliation.py' -v

      - name: Compare Coinalyze buy volume with official Binance ZIP+SHA256
        env:
          SOL_V8_COINALYZE_API_KEY: ${{ secrets.SOL_V8_COINALYZE_API_KEY || secrets.ETH_V7_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 sol_v8_bv_taker_reconciliation.py \
            --start 2026-11-01 --end 2026-11-09 \
            --output forward/sol_v8_bv_audit/latest.json \
            --markdown forward/sol_v8_bv_audit/latest.md

      - name: Preserve comparison evidence even if discrepancies exist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-v8-bv-binance-research-${{ github.run_id }}
          path: forward/sol_v8_bv_audit/
          if-no-files-found: ignore
          retention-days: 60

      - name: Commit only retrospective V8 research evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s forward/sol_v8_bv_audit/latest.json; then
            echo "No report to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/sol_v8_bv_audit/latest.json forward/sol_v8_bv_audit/latest.md
          if git diff --cached --quiet; then
            echo "No changed V8 research"
            exit 0
          fi
          git commit -m "SOL V8: Coinalyze vs Binance archival taker reconciliation evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v8-sol-derivatives-probe-20261110
            if git push origin HEAD:experiment/v8-sol-derivatives-probe-20261110; then
              echo "SOL V8 reconciliation evidence saved"
              exit 0
            fi
            sleep 3
          done
          exit 1
