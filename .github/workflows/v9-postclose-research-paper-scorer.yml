name: 'V9 research paper 4H GREEN RED after-close scorer'

# Scores *previously committed* BTC/ETH/SOL green/red predictions only.
# Runs independently ~12 min AFTER exact UTC 4H closes; never creates
# missing forecasts retroactively. Late execution is fail-safe.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-postclose-research-paper-scorer.yml'
  schedule:
    - cron: '12 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-4h-paper-outcomes-only
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated V9 paper research (do not touch main engine)
        uses: actions/checkout@v5
        with:
          ref: research/v9-prestart-live-data-compatibility-20261111
          persist-credentials: true

      - name: Ensure research-only branch and integrity tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/v9-prestart-live-data-compatibility-20261111"
          python3 -m unittest discover -s tests -p 'test_v9_next4h_paper_outcome_score.py' -q
          python3 -m unittest discover -s tests -p 'test_v9_prestart_attempt_coverage.py' -q

      - name: Score only previously saved fully CLOSED 4H candle bodies
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.SOL_V8_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 -u v9_next4h_paper_outcome_score.py
          python3 -u v9_prestart_attempt_coverage.py

      - name: Verify outcomes never overwrite predictions or invent paper success
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('forward/v9_next_4h_color/paper_scoreboard.json').read_text())
          assert j['status']=='V9_FORWARD_PAPER_SCOREBOARD_RESEARCH_ONLY'
          assert j['realOrders'] is False and j['productionModified'] is False
          assert j['no75PercentClaimUntilProspectiveEfficacy']
          assert j['mustKeepAllForecastsEvenIfWrong']
          assert j['completedTargetForecasts']<=j['totalPriorTargetForecasts']
          assert j['missingScheduledForecastSlotsBetweenFirstAndLast']>=0
          for asset,v in j['allSymbols'].items():
            stats=v['all']
            assert stats['evaluable']+stats['dojiExcluded']==j['completedTargetForecasts']
            assert stats['correct']<=stats['evaluable']
            assert stats['hitRatePct'] is None or 0<=stats['hitRatePct']<=100
          c=json.loads(Path('forward/v9_next_4h_color/attempt_coverage.json').read_text())
          assert c['expectedAlreadyStarted4HTargets']==(
              c['validForecastsCommittedBeforeOpenPerOriginalFile']+
              c['missed4HBeforeStartPredictionSlots'])
          assert c['noRetrospectiveImputation'] and c['missingAreFailuresNotAbstentions']
          assert c['noUserNotifications'] and not c['brokerOrders']
          print('V9_AFTER_CLOSE_OWN_OPEN_CLOSE_SCOREBOARD_VALID',j['completedTargetForecasts'],
                'missed_slots=',c['missed4HBeforeStartPredictionSlots'])
          PY

      - name: Publish separate paper result files to experiment branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_next_4h_color/paper_scoreboard.json
          git add forward/v9_next_4h_color/attempt_coverage.json
          if [ -d forward/v9_next_4h_color/paper_outcomes ]; then
            git add --all -- forward/v9_next_4h_color/paper_outcomes/
          fi
          if git diff --cached --quiet; then
            echo "V9_NO_NEW_SCORABLE_PAPER_CANDLES"
            exit 0
          fi
          git commit -m 'V9 paper: immutable forecast scored after own 4H close'
          for i in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then
              echo "V9_AFTER_CLOSE_RESEARCH_SCORE_PUBLISHED"
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Save auditable after-close paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-postclose-score-${{ github.run_id }}
          path: |
            forward/v9_next_4h_color/paper_outcomes/
            forward/v9_next_4h_color/paper_scoreboard.json
            forward/v9_next_4h_color/attempt_coverage.json
          if-no-files-found: ignore
          retention-days: 60
