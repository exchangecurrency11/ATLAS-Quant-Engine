name: ATLAS E4B real funding data source probe (research only)

on:
  push:
    branches:
      - research/atlas-core-v4-observed-funding-20261114
    paths:
      - .github/workflows/atlas-core-e4b-funding-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funding-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identify official funding data format and access (read only)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,zipfile,io,csv,hashlib
          base="https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2024-01.zip"
          for url in (base+".CHECKSUM",base,"https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&startTime=1704067200000&endTime=1704153600000&limit=10"):
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ATLAS-research-public-data/1"})
              with urllib.request.urlopen(req,timeout=18) as resp:
                raw=resp.read(500000)
                print("SOURCE_PROBE",url,"STATUS",resp.status,"LEN",len(raw),"HASH",hashlib.sha256(raw).hexdigest(),flush=True)
                if ".CHECKSUM" in url:
                  print("CHECKSUM",raw[:150],flush=True)
                elif url.endswith(".zip"):
                  z=zipfile.ZipFile(io.BytesIO(raw))
                  print("ZIP_FILES",z.namelist(),flush=True)
                  for name in z.namelist():
                    with z.open(name) as fp:
                      print("FUNDING_CSV_LINES",fp.readline()[:300],fp.readline()[:300],fp.readline()[:300],flush=True)
                else:
                  print("API_FUNDING_EXAMPLE",raw[:600],flush=True)
            except Exception as e:
              print("SOURCE_PROBE_ERROR",url,type(e).__name__,str(e)[:300],flush=True)
          PY
