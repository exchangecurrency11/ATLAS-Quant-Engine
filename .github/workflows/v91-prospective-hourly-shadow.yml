name: "V9.1 hourly V7 vs max4h retest prospective paper shadow NO ALERTS"
on:
  push:
    branches: [main]
    paths: [.github/workflows/v91-prospective-hourly-shadow.yml]
  workflow_dispatch:
  schedule:
    - cron: '34,43,49,55 * * * *'
  # Run again when the ORIGINAL V7 hourly capture actually finishes.
  workflow_run:
    workflows:
      - V7 Hourly Paper Forward Runner
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: v91-prospective-paper-hourly-readonly-v7
  cancel-in-progress: false
jobs:
  hourly-paper:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout isolated V9 research, full Git commit evidence
        uses: actions/checkout@v5
        with:
          ref: research/v9-prestart-live-data-compatibility-20261111
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout original V7 as read-only evidence
        uses: actions/checkout@v5
        with:
          ref: experiment/v7-signal-quality-20261103
          path: v7_evidence
          persist-credentials: false
      - name: Safety tests and branch isolation
        run: |
          set -euo pipefail
          python3 -m py_compile v91_prospective_retest.py
          python3 -m unittest discover -s tests -p test_v91_prospective_retest.py -q
          python3 -m unittest discover -s tests -p test_v91_retest_full_replay.py -q
          python3 -m unittest discover -s tests -p test_signal_quality_v7.py -q
          test "$(git branch --show-current)" = research/v9-prestart-live-data-compatibility-20261111
      - name: Check only the current verified V7 hour, never backfill
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          target="$(date -u +'%Y-%m-%dT%H-00Z')"
          minute="$(date -u +%M)"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$((10#$minute))" -lt 12 ] || [ "$((10#$minute))" -gt 57 ]; then
            echo "capture=false" >> "$GITHUB_OUTPUT"
            echo "V91_SKIP_OUTSIDE_CURRENT_HOUR_GATE"
          elif [ ! -f "v7_evidence/forward/snapshots/$target.json" ]; then
            echo "capture=false" >> "$GITHUB_OUTPUT"
            echo "V91_SKIP_MISSING_ORIGINAL_V7_HOURLY_CAPTURE"
          elif [ -f "forward/v91_prospective_retest/hourly/$target.json" ]; then
            echo "capture=false" >> "$GITHUB_OUTPUT"
            echo "V91_SKIP_ALREADY_IMMUTABLY_CAPTURED"
          else
            echo "capture=true" >> "$GITHUB_OUTPUT"
            echo "V91_CURRENT_ORIGINAL_V7_AVAILABLE_SOURCE_PARITY_PENDING"
          fi
      - name: Retrieve same 1H 4H Daily worker history and main data as original V7
        if: steps.gate.outputs.capture == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p forward/tmp/v91_history
          gh api "repos/$GITHUB_REPOSITORY/contents/market_data.json?ref=main" \
            --jq '.content' | base64 --decode > forward/tmp/v91_main_market.json
          test -s forward/tmp/v91_main_market.json
          for tf in 1hour 4hour daily; do
            curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --max-time 80 \
              -H 'Cache-Control: no-cache' \
              "https://btc-sol-futures-test.exchange-currency-1111.workers.dev/history?interval=$tf" \
              -o "forward/tmp/v91_history/history_$tf.json"
            test -s "forward/tmp/v91_history/history_$tf.json"
          done
      - name: Independent full V7 and max4h paper replay, strict point-in-time parity
        if: steps.gate.outputs.capture == 'true'
        env:
          V91_TARGET: ${{ steps.gate.outputs.target }}
        run: |
          set -euo pipefail
          python3 -u v91_prospective_retest.py \
            --v7-dir v7_evidence/forward/snapshots \
            --market forward/tmp/v91_main_market.json \
            --history-dir forward/tmp/v91_history \
            --out forward/v91_prospective_retest/hourly \
            --scoreboard forward/v91_prospective_retest/scoreboard.json
          test -s "forward/v91_prospective_retest/hourly/${{ steps.gate.outputs.target }}.json"
          test -s forward/v91_prospective_retest/scoreboard.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ.get("V91_TARGET")
          if not target:
              raise ValueError("V91_TARGET_NOT_PASSED")
          j=json.loads((Path("forward/v91_prospective_retest/hourly")/(target+".json")).read_text())
          assert j["priceAndVolumeValidatedAgainstOriginalV7For1H4HDaily"]
          assert j["mainWorkerDataSameCoinalyzeProviderNotIndependentBinanceProof"]
          assert j["unverifiedCoinalyzeTXOIFundingNotUsedAsV91EntryFilter"]
          assert j["sourceVerifiedSameHour"] and j["V7SnapshotAndIndependentRecomputeExactMatch"]
          assert j["noBrokerOrders"] and j["noNotifications"]
          assert set(j["originalV7PriceVolumeParities"])=={"BTCUSDT","SOLUSDT"}
          for symbol in ("BTCUSDT","SOLUSDT"):
              frames=j["originalV7PriceVolumeParities"][symbol]
              assert set(frames)=={"1hour","4hour","daily"}
              assert all(x["allOHLCVFieldsWithinIntegrityTolerances"] for x in frames.values())
          print("V91_FRESH_1H_4H_DAILY_OHLCV_INTEGRITY_VERIFIED_BOTH_SYMBOLS")
          PY
      - name: Verify all paper guards and produce readable scorecard
        if: steps.gate.outputs.capture == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('forward/v91_prospective_retest/scoreboard.json').read_text())
          assert x["mode"]=="V91_PROSPECTIVE_CAUSAL_PAPER_SCOREBOARD"
          assert x["originalV7Untouched"] and x["noBackfilledOrPostSelectedTrades"]
          assert x["missingHourObservationsMustNotBeFilled"]
          assert x["noBrokerOrders"] and x["noNotifications"]
          assert x["thresholdsNotReoptimizedFromNewObservations"]
          assert x["unverifiedDerivativeFieldsNeverBecomeEntryVeto"]
          assert x["v91SourceIntegrityRequiresV7Original1H4HDailyOHLCV"]
          assert x["liveBinanceVsCoinalyzeParityNotProven"]
          assert x["delayedSignalPublicationNotModeledInNetR"]
          assert x["realTimeExecutableEntryCountProven"]==0
          lines=["# V9.1 Prospective V7 vs 4-hour retest shadow",
            "","**Research paper-only. No trading orders or user notifications.**",
            "","First captured hour: "+str(x["sinceFirstActualSavedVerifiedCaptureUTC"]),
            "Verified hours: "+str(x["savedDistinctVerifiedHours"]),
            "","| Symbol | System | Closed trades | Win % | Net R 9bp/side | Stress Net R 25bp/side |",
            "|---|---|---:|---:|---:|---:|"]
          for sym,variants in x["results"].items():
            for name,m in variants.items():
              lines.append(f'| {sym} | {name} | {m["eligibleClosedPaperTrades"]} | {m["winRatePct"]} | {m["totalNetR9BpsPerSide"]} | {m["totalNetR25BpsPerSide"]} |')
          lines+=["","Missing prior sealed retests are EXCLUDED, never backfilled.",
                  "IMPORTANT: A verified signal recorded 15-55 minutes after the close CANNOT prove a fill at the immediately following hour open.",
                  "Next-open prices are retrospective hypothetical paper assumptions, NOT actual fills.",
                  "Real-time executable entries proven: ZERO. Signal publication delay is not priced into paper net R.",
                  "BTC/SOL 1H, 4H, and Daily OHLCV compared against sealed original V7 snapshots; source mismatch prevents paper entry from being counted.",
                  "Both live feeds are Coinalyze-based; this is an integrity check, NOT independent verified Binance live exchange parity.",
                  "Coinalyze TX/OI/funding are NOT used as an entry veto in this research system.",
                  "Funding, dynamic spread, liquidation and real broker execution unmodeled.",
                  "Past 4h filter was selected after inspecting historical results; NEW outcomes required.",""]
          Path('forward/v91_prospective_retest/scoreboard.md').write_text('\n'.join(lines))
          print('V91_PROSPECTIVE_VERIFIED_PAPER_SCOREBOARD_SILENT',x["savedDistinctVerifiedHours"])
          PY
      - name: Commit only append-only V9 research observation and scorecard
        if: steps.gate.outputs.capture == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/v9-prestart-live-data-compatibility-20261111
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "forward/v91_prospective_retest/hourly/${{ steps.gate.outputs.target }}.json" \
                  forward/v91_prospective_retest/scoreboard.json \
                  forward/v91_prospective_retest/scoreboard.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V9.1 sealed prospective hourly original V7 vs 4h retest PAPER ONLY"
          for attempt in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then
              echo "V91_SEALED_CURRENT_HOUR_RESEARCH_ONLY_NO_USER_ALERTS"
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Distinguish workflow success from actual sealed 1H observation
        if: always()
        shell: bash
        env:
          DID_CAPTURE: ${{ steps.gate.outputs.capture }}
          TARGET: ${{ steps.gate.outputs.target }}
        run: |
          echo "### V9.1 hourly source health (research only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Target UTC: ${TARGET:-not-verified}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DID_CAPTURE:-false}" != "true" ]; then
            echo "**NO NEW PAPER OBSERVATION** — V7 not ready, prior hour already sealed or outside genuine current-hour window." >> "$GITHUB_STEP_SUMMARY"
            echo "A green scheduled workflow does NOT mean a verified market hour was captured." >> "$GITHUB_STEP_SUMMARY"
          elif test -s forward/v91_prospective_retest/scoreboard.json; then
            echo "Paper observation attempted and scorecard written. Verify the preceding Git commit step completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**SOURCE REJECTED** — V9.1 did not produce a valid paper scoreboard." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain audit bundle without notification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v91-prospective-v7-vs-4h-${{ github.run_id }}
          path: |
            forward/tmp/v91_main_market.json
            forward/tmp/v91_history/history_*.json
            forward/v91_prospective_retest/scoreboard.json
            forward/v91_prospective_retest/hourly/${{ steps.gate.outputs.target }}.json
          if-no-files-found: ignore
          retention-days: 14
