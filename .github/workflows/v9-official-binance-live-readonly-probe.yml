name: 'V9 official Binance public 1H live REST access research probe'

on:
  push:
    branches: [research/v9-prestart-live-data-compatibility-20261111]
    paths:
      - v9_official_binance_live_rest_probe.py
      - tests/test_v9_official_binance_live_rest_probe.py
      - .github/workflows/v9-official-binance-live-readonly-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Audit exact public endpoint source semantics without trading credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_v9_official_binance_live_rest_probe.py' -v
          python3 -u v9_official_binance_live_rest_probe.py
      - name: Refuse unproven Binance direct data when network unavailable
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('forward/v9_source_parity/binance_live_rest_access.json'))
          assert x['status']=='V9_OFFICIAL_BINANCE_LIVE_REST_ACCESS_PROBE_NO_ORDERS'
          assert not x['alertsEnabled'] and not x['orders'] and not x['productionModified']
          assert set(x['assets'])=={'BTCUSDT','ETHUSDT','SOLUSDT'}
          if not x['allThreeOfficialRESTSourceAvailable']:
            assert x['sourceUnavailableDoesNotAuthorizeUnverifiedTX']
          print('V9_OFFICIAL_BINANCE_SOURCE_ACCESS_VERIFIED',
                x['allThreeOfficialRESTSourceAvailable'])
          PY
      - name: Preserve evidence even if source geo-blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-public-binance-rest-readonly-${{ github.run_id }}
          path: forward/v9_source_parity/binance_live_rest_access.json
          if-no-files-found: ignore
      - name: Commit public-source access status only to research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_source_parity/binance_live_rest_access.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V9: Binance USD-M public REST 1H data access evidence only'
          for i in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then exit 0; fi
            sleep 3
          done
          exit 1
