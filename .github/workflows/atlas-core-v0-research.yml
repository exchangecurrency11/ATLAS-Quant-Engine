name: ATLAS Core v0 causal-contract and frozen-evidence audit (RESEARCH ONLY)

# Only on independent research branch, never on a schedule, never writes to Git.
on:
  push:
    branches:
      - research/atlas-core-v0-evidence-20261114
    paths:
      - research/atlas_core_v0/**
      - .github/workflows/atlas-core-v0-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-core-v0-isolated-science-contracts
  cancel-in-progress: false

jobs:
  causal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v5
        with:
          ref: research/atlas-core-v0-evidence-20261114
          persist-credentials: false
          fetch-depth: 1

      - name: Verify no main checkout or production modification
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/atlas-core-v0-evidence-20261114"
          test -f research/atlas_core_v0/atlas_core_v0.py
          python3 -m py_compile research/atlas_core_v0/atlas_core_v0.py

      - name: E1 deterministic time leakage cost gap and input tests
        run: |
          set -euo pipefail
          python3 -m unittest research.atlas_core_v0.test_atlas_core_v0 -v

      - name: E0 sealed historical BTC SOL evidence audit
        run: |
          set -euo pipefail
          python3 research/atlas_core_v0/atlas_core_v0.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/atlas_core_v0/output/e0_report.json")
          result=json.loads(p.read_text())
          assert result["status"]=="ATLAS_CORE_RESEARCH_ONLY"
          assert result["independentOutOfSample"] is False
          assert result["forwardTrades"] is None
          assert result["archivesRedownloadedThisRun"] is False
          assert result["ethIncludedInE0"] is False
          assert not result["productionTouched"]
          assert not result["orders"] and not result["notifications"]
          assert set(result["assets"])=={"BTCUSDT","SOLUSDT"}
          assert all(row["decision"].startswith("BLOCK") for row in result["assets"].values())
          print("ATLAS_CORE_V0_NO_UNEARNED_ALPHA_NO_PRODUCTION_WRITES")
          PY

      - name: Upload temporary proof artifact, no commit or push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-core-v0-research-proof
          path: research/atlas_core_v0/output/
          if-no-files-found: ignore
          retention-days: 30
