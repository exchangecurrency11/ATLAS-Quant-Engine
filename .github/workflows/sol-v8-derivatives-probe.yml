name: SOL V8 read-only derivatives connectivity smoke test

# Isolated experiment branch only; no scheduled or live trading jobs.
on:
  push:
    branches:
      - experiment/v8-sol-derivatives-probe-20261110
    paths:
      - sol_v8_derivatives_probe.py
      - tests/test_sol_v8_derivatives_probe.py
      - .github/workflows/sol-v8-derivatives-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sol-v8-derivatives-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout isolated V8 test only
        uses: actions/checkout@v5

      - name: Test SOL derivatives data freshness and safety
        run: python3 -m unittest discover -s tests -p 'test_sol_v8_derivatives_probe.py' -v

      - name: Fetch read-only SOL OI funding and provider buy-volume
        env:
          SOL_V8_COINALYZE_API_KEY: ${{ secrets.SOL_V8_COINALYZE_API_KEY || secrets.ETH_V7_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 sol_v8_derivatives_probe.py \
            --output forward/sol_v8_derivatives_probe/latest.json \
            --strict

      - name: Preserve probe result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-v8-derivatives-${{ github.run_id }}
          path: forward/sol_v8_derivatives_probe/latest.json
          if-no-files-found: ignore
          retention-days: 30
