name: SOL V8 Hourly Derivatives Research (no orders)

# Runs from main scheduler, checks out only an isolated V8 experiment.
# This never sends orders or modifies BTC/SOL trading/market-data jobs.
on:
  schedule:
    - cron: '18 * * * *'
    - cron: '38 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sol-v8-hourly-research.yml'

permissions:
  contents: write

concurrency:
  group: sol-v8-hourly-readonly-research
  cancel-in-progress: false

jobs:
  sol-v8-paper-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require last closed hour's fresh observation window
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          minute="$(date -u +%M)"
          if (( 10#$minute < 10 || 10#$minute > 58 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "NO_OBSERVATION: outside the safe last-hour sampling window"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=$(date -u +%Y-%m-%dT%H-00Z)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout independent SOL V8 experiment only
        if: steps.timing.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: experiment/v8-sol-derivatives-probe-20261110
          persist-credentials: true

      - name: Verify research-only data-guard tests
        if: steps.timing.outputs.run == 'true'
        run: python3 -m unittest discover -s tests -p 'test_sol_v8_derivatives_probe.py' -v

      - name: Observe latest closed SOL perpetual hour (read-only)
        if: steps.timing.outputs.run == 'true'
        env:
          SOL_V8_COINALYZE_API_KEY: ${{ secrets.SOL_V8_COINALYZE_API_KEY || secrets.ETH_V7_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
          TARGET: ${{ steps.timing.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forward/sol_v8_derivatives_probe/tmp forward/sol_v8_derivatives_probe/snapshots
          snapshot="forward/sol_v8_derivatives_probe/snapshots/$TARGET.json"
          tmp="forward/sol_v8_derivatives_probe/tmp/$TARGET.json"
          if test -f "$snapshot" && grep -q '"status": "DATA_VALIDATED_RESEARCH_ONLY"' "$snapshot"; then
            echo "PRESERVED_VERIFIED_SOL_V8_SNAPSHOT $TARGET"
            exit 0
          fi
          python3 sol_v8_derivatives_probe.py --output "$tmp"
          # Failed snapshots remain valid audit evidence, not no-signal hours.
          if ! test -f "$snapshot" || grep -q '"status": "DATA_VALIDATED_RESEARCH_ONLY"' "$tmp"; then
            mv "$tmp" "$snapshot"
          fi
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); print("SOL_V8_OBSERVATION",s["status"],s["targetClosed1HUTC"])' "$snapshot"

      - name: Upload observed data or failure evidence
        if: always() && steps.timing.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sol-v8-hourly-${{ github.run_id }}
          path: |
            forward/sol_v8_derivatives_probe/tmp/*.json
            forward/sol_v8_derivatives_probe/snapshots/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit only V8 experimental audit snapshots
        if: steps.timing.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/sol_v8_derivatives_probe/snapshots/
          if git diff --cached --quiet; then
            echo "No new SOL V8 paper audit"
            exit 0
          fi
          git commit -m "SOL V8: hourly read-only derivatives data health audit"
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v8-sol-derivatives-probe-20261110
            if git push origin HEAD:experiment/v8-sol-derivatives-probe-20261110; then
              echo "SOL_V8_AUDIT_PERSISTED"
              exit 0
            fi
            sleep 4
          done
          echo "SOL_V8_AUDIT_PERSIST_FAILED" >&2
          exit 1

      - name: Fail closed if SOL data is unverified
        if: always() && steps.timing.outputs.run == 'true'
        shell: bash
        env:
          TARGET: ${{ steps.timing.outputs.target }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path("forward/sol_v8_derivatives_probe/snapshots")/(os.environ["TARGET"]+".json")
          try:
              j=json.loads(p.read_text())
              healthy=(j["status"]=="DATA_VALIDATED_RESEARCH_ONLY" and
                       j["brokerOrders"] is False and
                       j["productionSystemModified"] is False and
                       j["liveSignalEnabled"] is False and
                       j["openInterest"]["threeContinuousClosedHours"] is True and
                       j["providerBuyVolume"]["takerBuySellCrossSourceVerified"] is False and
                       j["funding"]["ageSeconds"] <= 12*3600)
          except (OSError,KeyError,ValueError,TypeError):
              healthy=False
          if not healthy:
              print("::error title=SOL V8 data health::Source unavailable or invalid; NO SIGNAL")
              sys.exit(1)
          print("SOL_V8_RESEARCH_DATA_VERIFIED: OI, funding, provider buy volume. NO SIGNAL OR ORDERS")
          PY
