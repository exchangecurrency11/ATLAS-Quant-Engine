name: 'V9 independent Binance Coinalyze full 1H field parity (research only)'

on:
  push:
    branches: [research/v9-prestart-live-data-compatibility-20261111]
    paths:
      - v9_binance_coinalyze_seven_field_parity.py
      - tests/test_v9_binance_coinalyze_seven_field_parity.py
      - .github/workflows/v9-binance-coinalyze-seven-field-parity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-binance-coinalyze-parity-research
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen research-only V9
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Confirm independent source parity unit tests before networking
        run: |
          python3 -m unittest discover -s tests -p 'test_v9_binance_coinalyze_seven_field_parity.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_next4h_prestart_paper_capture.py' -q

      - name: Independently compare SHA256-verified Binance daily 1H archives vs Coinalyze
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.SOL_V8_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 -u v9_binance_coinalyze_seven_field_parity.py

      - name: Preserve actual parity successes and mismatches WITHOUT inventing source equivalence
        run: |
          python3 - <<'PY'
          import json
          z=json.load(open('forward/v9_source_parity/compare.json'))
          assert z['status']=='V9_CROSS_SOURCE_1H_CANDLE_FLOW_PARITY_AUDIT_NOT_SIGNAL'
          assert set(z['perAsset'])=={'BTCUSDT','ETHUSDT','SOLUSDT'}
          assert z['brokerOrders'] is False and z['productionModified'] is False
          assert z['notificationsEnabled'] is False
          assert z['noModelTrainingOrWeightUpdates']
          assert z['mustNotPretendUnverifiedFieldsAreVerified']
          for asset,x in z['perAsset'].items():
            if x['hourlyCandlesCompared']==0:
              assert not x['allSevenFieldsMatched']
          print('V9_FIELD_PARITY_AUDITED', {s: {
            'hours':a['hourlyCandlesCompared'],
            'price':a['OHLCVMatchedEveryComparedHour'],
            'bv':a['takerBuyBaseMatchedEveryComparedHour'],
            'tx':a['CoinalyzeTXequalsOfficialTradeCount']
          } for s,a in z['perAsset'].items()})
          PY

      - name: Preserve mismatch evidence even if no provider data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-binance-coinalyze-seven-field-parity-${{ github.run_id }}
          path: forward/v9_source_parity/
          if-no-files-found: ignore
          retention-days: 60

      - name: Save only research cross-source verification, no V7 writes
        if: success()
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/v9-prestart-live-data-compatibility-20261111
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_source_parity/compare.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V9 source audit: official Binance daily SHA256 vs Coinalyze BTC ETH SOL 1H 7 fields"
          for i in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then exit 0; fi
            sleep 4
          done
          exit 1
