name: 'V9 V7+ full PROFIT trade-first backtest on same historical candles NO alerts'

on:
  push:
    branches: [research/v9-prestart-live-data-compatibility-20261111]
    paths:
      - v9_v7_full_profit_backtest.py
      - tests/test_v9_v7_full_profit_backtest.py
      - v9_v7_historical_paper_trade_ledger.py
      - tests/test_v9_v7_historical_paper_trade_ledger.py
      - v9_trade_opportunity_quality.py
      - tests/test_v9_trade_opportunity_quality.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v9-v7-full-profit-vs-direction-research
  cancel-in-progress: false

jobs:
  paper-profit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated frozen V9 research only
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install fixed-form logistic historical replay dependencies only
        run: |
          python3 -m pip install --disable-pip-version-check 'numpy<3' 'scipy<2' 'scikit-learn>=1.4,<2'

      - name: Validate V9 4H before target BOS decision and V7 paper exit costing
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_v9_trade_opportunity_quality.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_v7_full_profit_backtest.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_v7_historical_paper_trade_ledger.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_next_4h_color_research.py' -q
          python3 -m unittest discover -s tests -p 'test_v9_no_provider_tx_ablation.py' -q
          python3 -m unittest discover -s tests -p 'test_signal_quality_v7.py' -q

      - name: Download ORIGINAL V7 SHA-verified archive (do not modify original V7)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v7_archived
          gh run download 41638329887 --repo "$GITHUB_REPOSITORY" \
            -n btc-sol-official-binance-verified-through-2026-11-02 \
            -D v7_archived
          for tf in 1hour 4hour daily; do
            test -s "v7_archived/history_$tf.json"
          done

      - name: Re-download checked Binance BTC ETH SOL 2023-Sep2026, retrain only within historical walk-forward folds, sequentially replay V7 paper trades
        run: |
          set -euo pipefail
          python3 -u v9_v7_full_profit_backtest.py

      - name: Assert full sequential apples-to-apples strategy not selected fake winning trades
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('forward/v9_v7_profit_backtest/compare.json')
          x=json.loads(p.read_text())
          assert x['status']=='V9_V7_PLUS_BOS_RETEST_FULL_CHRONOLOGICAL_PROFIT_BACKTEST_HISTORICAL'
          assert x['V7StrategyIsPrimary'] and x['V9PredictedOwn4HCandleColorIsOnlyOptionalPreknownBOSGate']
          assert x['sameChronologicalSimulationAndRiskStopTPForEachVariant']
          assert x['allSourcePricesStrictlyReconciledWithOriginalV7']
          assert x['V9ForecastTMinus5MinutesForEach4HBeforeBOSSignal']
          assert not x['prospectiveOrPreviouslyUnseenOutOfSample']
          assert x['noBrokerOrders'] and x['noUserNotifications']
          assert x['productionV7AndOriginalV9ModelsNotModified']
          assert x['modelOrAlertPromotionBlocked']
          assert set(x['candidateHistorical'])=={'BTCUSDT','SOLUSDT'}
          assert x['individualHistoricalPaperTradesWrittenAndValidated']>0
          expected={'V7_ORIGINAL','V9_94_DIRECTION_GATE',
                    'V9_88_NO_TX_DIRECTION_GATE','V9_94_AND_88_AGREEMENT_GATE',
                    'V9_QUALITY_SCORE_60','V9_QUALITY_SCORE_75'}
          assert x['newV9QualityV7OnlyRegimeFVGOBLiquidityResearch']
          assert x['qualityThresholdsPredeclaredBeforeNewResultExecution']=={
              'V9_QUALITY_SCORE_60':60,'V9_QUALITY_SCORE_75':75}
          assert x['qualityOnlyUsesClosed1HAtOriginalV7BOS']
          assert x['qualityScoresNotCalibratedProfitProbabilities']
          import csv
          ledger=Path('forward/v9_v7_profit_backtest/paper_trades/trade_ledger.json')
          if not ledger.is_file():raise AssertionError('MISSING_REAL_CANDLE_PAPER_LEDGER')
          l=json.loads(ledger.read_text())
          assert l['status']=='V9_V7_HISTORICAL_CANDLE_BY_CANDLE_PAPER_LEDGER_AND_ILLUSTRATIVE_100USDT_10X'
          assert l['initialCapitalUSDT']==100 and l['leverageIsolated']==10
          assert l['originalV7BOSRetestStopTPAndPaperFillsUnchanged']
          assert l['noBrokerOrders'] and l['noUserNotifications'] and not l['productionModified']
          assert l['retrospectiveTradesNotActualTrades']
          assert x['individualHistoricalPaperTradesWrittenAndValidated']==len(
              l['allCompletedHistoricalPaperTradeLedger'])
          for symbol,m in x['candidateHistorical'].items():
            for variant,s in m.items():
              trades=[r for r in l['allCompletedHistoricalPaperTradeLedger']
                      if r['symbol']==symbol and r['variant']==variant]
              assert len(trades)==s['V7paperClosedTrades']
              assert round(sum(r['netR9BpsPerSide'] for r in trades),4)==s['totalNetR9BpsPerSide']
              for t in trades:
                assert t['noRealFill'] and t['watchConfirmedUTC']<t['retestConfirmedUTC']
                assert t['retestConfirmedUTC']<=t['entryOpenUTC']<t['exitKnownUTC']
          portfolio=l['portfolioPaperAccounts']
          assert set(portfolio)==expected
          for variant,acct in portfolio.items():
            assert acct['notAVerifiedUSDProfit']
            assert acct['originalEligibleHistoricalPaperTrades']==sum(
                m[variant]['V7paperClosedTrades'] for m in x['candidateHistorical'].values())
            assert acct['paperTradesNotBlockedByIllustrativeMargin']+acct[
                'paperTradesSkippedByIllustrativeMarginOrExposure']==acct[
                'originalEligibleHistoricalPaperTrades']
          rows=list(csv.DictReader(open('forward/v9_v7_profit_backtest/paper_trades/all_paper_trades.csv',encoding='utf-8-sig')))
          assert len(rows)==x['individualHistoricalPaperTradesWrittenAndValidated']
          for sym,v in x['candidateHistorical'].items():
            assert set(v)==expected
            for name,s in v.items():
              assert s['fullySequentialSameOriginalV7Candles']
              assert s['next1HOpenPaperEntryAndSameStopTPTimingAsV7']
              assert s['filtersOnlyV7AlreadyQualifyingBOS']
              assert s['tradeRetestWasObservedBeforeEntry']
              assert s['V7paperClosedTrades']>=0
              if s['V7paperClosedTrades']==0:
                  assert s['averageNetR9BpsPerSide'] is None
                  assert s['totalNetR9BpsPerSide'] is None
          print('V9_PLUS_QUALITY_RESEARCH_SAME_CHRONOLOGICAL_V7_RETEST_PROFIT_AUDITED',len(rows))
          PY

      - name: Keep original full backtest research results even if commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-v7-full-chronological-profit-first-${{ github.run_id }}
          path: forward/v9_v7_profit_backtest/
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish comparison to V9 research branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/v9-prestart-live-data-compatibility-20261111
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_v7_profit_backtest/compare.json \
                  forward/v9_v7_profit_backtest/compare.md \
                  forward/v9_v7_profit_backtest/paper_trades/trade_ledger.json \
                  forward/v9_v7_profit_backtest/paper_trades/trade_ledger.md \
                  forward/v9_v7_profit_backtest/paper_trades/all_paper_trades.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V9 vs original V7: full BOS retest sequential 1H trade PnL backtest (9bp and 25bp cost) research only'
          for i in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then
              echo "V9_V7_FULL_CHRONOLOGICAL_PAPER_PROFIT_BACKTEST_RECORDED_NO_ALERT"
              exit 0
            fi
            sleep 5
          done
          exit 1
