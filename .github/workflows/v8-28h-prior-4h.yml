name: V8 28h prior no-MACD 4H comparison BTC ETH SOL
on:
  push:
    branches: [experiment/v8-blind-4h-review-20261110]
    paths:
      - v8_28h_before_4h_macdfree.py
      - .github/workflows/v8-28h-prior-4h.yml
  workflow_dispatch:

permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated experiment only
        uses: actions/checkout@v5
      - name: Compare frozen Nov 9 15 TSİ to Nov 9 19 TSİ (no MACD)
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: python3 -u v8_28h_before_4h_macdfree.py
      - name: Check no-lookahead source and all three coins
        run: |
          python3 - <<'PY'
          import json
          obj=json.load(open("forward/v8_blind4h/2026-11-09_no_macd_15-to-19-TSI.json"))
          assert obj["asOfUTC"]=="2026-11-09T12:00:00Z"
          assert obj["comparedUTC"]=="2026-11-09T16:00:00Z"
          assert not obj["brokerOrders"] and not obj["MACDusedForAnyDecision"]
          assert set(obj["coins"])=={"BTCUSDT_PERP.A","ETHUSDT_PERP.A","SOLUSDT_PERP.A"}
          assert not obj["coins"]["ETHUSDT_PERP.A"]["asOf15RealtimeSnapshotVerified"]
          assert all(x["outcome19"]["next4hClose"]>0 for x in obj["coins"].values())
          print("NOV9_15_TO_19_NO_MACD_THREE_ASSET_AUDIT_PASSED")
          PY
      - name: Preserve audit even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-nov9-4h-${{ github.run_id }}
          path: forward/v8_blind4h/2026-11-09_no_macd_15-to-19-TSI.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit only isolated research evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v8_blind4h/2026-11-09_no_macd_15-to-19-TSI.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8 research: freeze Nov 9 15 TSİ then compare Nov 9 19 TSİ"
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v8-blind-4h-review-20261110
            if git push origin HEAD:experiment/v8-blind-4h-review-20261110; then exit 0; fi
            sleep 3
          done
          exit 1
