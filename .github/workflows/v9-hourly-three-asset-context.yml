name: 'V9 Hourly BTC ETH SOL Market Context (paper only)'

# V7-like three opportunities per hour. V9 publishes a verified and
# IMMUTABLE 1H read-only observation and latest closed Daily/4H context.
# The official next 4H green/red paper forecast is NEVER synthesized here.
# This DOES NOT send ChatGPT notifications; those require a separate task.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v9-hourly-three-asset-context.yml
  workflow_run:
    workflows:
      - Publish BTC SOL Market Data
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
    - cron: '35 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-hourly-three-asset-paper-only
  cancel-in-progress: false

jobs:
  hourly:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated V9 research branch, never V7/production
        uses: actions/checkout@v5
        with:
          ref: research/v9-prestart-live-data-compatibility-20261111
          persist-credentials: true

      - name: Gate valid 1H observation time and avoid duplicate snapshots
        id: gate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, pathlib, time
          t=int(time.time())
          latest=t//3600*3600
          stamp=datetime.datetime.fromtimestamp(latest,datetime.timezone.utc).strftime('%Y-%m-%dT%H-00Z')
          existing=pathlib.Path('forward/v9_next_4h_color/hourly/snapshots')/(stamp+'.json')
          valid=12*60<=t-latest<=58*60 and not existing.exists()
          print('run='+('true' if valid else 'false'))
          print('observedClosedHourUTC='+stamp)
          print('existingSnapshot='+str(existing.exists()).lower())
          PY

      - name: Show hourly gate outcome
        shell: bash
        run: |
          echo "Hour: ${{ steps.gate.outputs.observedClosedHourUTC }}"
          echo "Should capture: ${{ steps.gate.outputs.run }}"
          echo "Already recorded: ${{ steps.gate.outputs.existingSnapshot }}"

      - name: Verify all three asset statuses and untouched original 4H forecast
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_v9_hourly_three_asset_observer.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_next4h_prestart_paper_capture.py' -q
          python3 -m unittest discover -s tests -p 'test_v9_next4h_paper_outcome_score.py' -q

      - name: Capture REAL completed 1H, 4H and Daily context BTC ETH SOL
        if: steps.gate.outputs.run == 'true'
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.SOL_V8_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 -u v9_hourly_three_asset_observer.py

      - name: Audit status and preserved V9 prestart-only label
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('forward/v9_next_4h_color/hourly/latest.json'))
          assert x['status']=='V9_HOURLY_OBSERVATION_VERIFIED_PAPER_CONTEXT_ONLY'
          assert x['doesNotRepaintOrBackfillMissing4HForecasts'] is True
          assert x['officialNext4HColorRequiresBeforeStartRecord'] is True
          assert x['realOrders'] is False and x['productionModified'] is False
          assert set(x['assets'])=={'BTCUSDT','ETHUSDT','SOLUSDT'}
          for coin in x['assets'].values():
            assert coin['contextOnlyNotANewPrestartDirectionForecast']
            assert set(('1H','4H','Daily')).issubset(set(coin))
          for which in ('active4HPriorOfficialPrediction','next4HPriorOfficialPrediction'):
            assert x[which]['status'] in (
              'NO_PRESTART_FORECAST_RECORDED','FROZEN_BEFORE_START_PAPER_FORECAST_RECORDED')
          print('V9_VERIFIED_HOURLY_STATUS_ONLY_NOT_A_FUTURE_SIGNAL',x['closed1HUTC'])
          PY

      - name: Preserve report strictly to experiment branch with retry
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/v9-prestart-live-data-compatibility-20261111"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_next_4h_color/hourly/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V9 research: verified BTC ETH SOL hourly market context; no future prediction'
          for i in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then
              echo 'V9_HOURLY_BTC_ETH_SOL_PAPER_REPORT_PERSISTED'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Preserve audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-hourly-context-${{ github.run_id }}
          path: |
            forward/v9_next_4h_color/hourly/latest.json
            forward/v9_next_4h_color/hourly/latest.md
          if-no-files-found: ignore
          retention-days: 30
