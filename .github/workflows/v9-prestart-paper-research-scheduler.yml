name: 'V9 research-only BTC ETH SOL prestart GREEN RED paper journal'

# Dedicated research dispatcher on default branch because GitHub schedule
# does not trigger workflows placed only on a feature branch.
# The existing main production code, current signal engine and alerts remain
# unchanged. No trading APIs or broker credentials are used.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v9-prestart-paper-research-scheduler.yml
  workflow_run:
    workflows:
      - Publish BTC SOL Market Data
      - Publish BTC SOL Market Structure
      - ETH V7 Independent Hourly Paper Forward (no orders)
      - V9 Hourly BTC ETH SOL Market Context (paper only)
      - V7 Hourly Paper Forward Runner
    types: [completed]
    branches: [main]
  schedule:
    # 17 minutes before every UTC 00/04/08/12/16/20 4H candle
    # Correct UTC pre-open HOURS: 23,03,07,11,15,19; attempts minute 36..53.
    # TSİ pre-open HOURS: 02,06,10,14,18,22.
    # GitHub schedule can run late. A successful market-data publication
    # also triggers this isolated workflow as a fallback. Both modes skip
    # outside T-25m..T-3m (never backfill a missed candle).
    # Redundant 5-minute staggered attempts; one immutable forecast per 4H target.
    # Late or duplicate attempts skip safely before touching market data.
    - cron: '36,41,46,51,53 23,3,7,11,15,19 * * *'
    # Additional independent prestart check times, still 3-25m gate.
    - cron: '38,44,49,54 23,3,7,11,15,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-research-paper-prestart-only
  cancel-in-progress: false

jobs:
  record-and-evaluate-paper-only:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only frozen experimental implementation (NOT main signal engine)
        uses: actions/checkout@v5
        with:
          ref: research/v9-prestart-live-data-compatibility-20261111
          persist-credentials: true
      - name: Gate exact 3 to 25 minute BEFORE start window and prevent duplicate predictions
        id: window
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,pathlib,time
          t=int(time.time())
          target=(t//14400+1)*14400
          gap=target-t
          stamp=datetime.datetime.fromtimestamp(target,datetime.timezone.utc).strftime('%Y-%m-%dT%H-%M-%SZ')
          existing=pathlib.Path("forward/v9_next_4h_color/paper_forecasts")/(stamp+".json")
          allowed=180<=gap<=1500 and not existing.exists()
          print("capture="+("true" if allowed else "false"))
          print("targetUTC="+stamp)
          print("minutesToStart="+str(round(gap/60,2)))
          PY
      - name: Report scheduled window gate
        run: |
          echo "Prestart capture allowed: ${{ steps.window.outputs.capture }}"
          echo "Target: ${{ steps.window.outputs.targetUTC }}"
          echo "Minutes to open: ${{ steps.window.outputs.minutesToStart }}"
      - name: Verify attached research branch is the only writable destination
        if: steps.window.outputs.capture == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/v9-prestart-live-data-compatibility-20261111"
          python3 -m py_compile v9_next_4h_color_research.py v9_next4h_prestart_paper_capture.py v9_next4h_paper_outcome_score.py v9_no_provider_tx_ablation.py
          python3 -m unittest discover -s tests -p 'test_v9_next4h_prestart_paper_capture.py' -q
          python3 -m unittest discover -s tests -p 'test_v9_next4h_paper_outcome_score.py' -q
          test -f forward/v9_next_4h_color/frozen_models.json
          test -f forward/v9_no_tx_ablation/frozen_models_research_only.json
      - name: Capture all three UNCALIBRATED paper colors before next 4H opens
        if: steps.window.outputs.capture == 'true'
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.SOL_V8_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u v9_next4h_prestart_paper_capture.py
      - name: Publish original forecast BEFORE the next target 4H starts
        if: steps.window.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,glob,time,datetime
          paths=glob.glob("forward/v9_next_4h_color/paper_forecasts/*.json")
          recent=[p for p in paths if datetime.datetime.fromisoformat(
             json.load(open(p))["target4HStartUTC"].replace("Z","+00:00")).timestamp()>time.time()]
          assert len(recent)==1, "EXPECTED_ONE_UNOPENED_TARGET_PREDICTION"
          j=json.load(open(recent[0]))
          T=datetime.datetime.fromisoformat(j["target4HStartUTC"].replace("Z","+00:00")).timestamp()
          assert time.time()<T-180, "TOO_LATE_TO_ATTEST_PREDICTION_BEFORE_OPEN"
          assert j["brokerOrders"] is False and j["noTargetOpenKnown"]
          assert j["noUserNotifications"] is True and j["productionModified"] is False
          x=j["researchOnlyShadow88NoProviderTradeCount"]
          assert x["status"]=="FROZEN_88_NO_PROVIDER_TX_PARALLEL_PAPER_NOT_PROMOTED"
          assert x["neverEnableNotificationsFromThisExperiment"]
          assert set(x["shadowAssetForecasts"])=={"BTCUSDT","ETHUSDT","SOLUSDT"}
          assert all(z["noCoinalyzeTXUsedInFeatureVector"] for z in x["shadowAssetForecasts"].values())
          from v9_next4h_paper_outcome_score import verify_prior_forecast
          verify_prior_forecast(j)
          print("V9_94_AND_NO_TX_88_SHADOW_PAPER_FORECAST_STRICTLY_BEFORE_4H_OPEN",
                j["target4HStartUTC"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_next_4h_color/paper_forecasts/
          git diff --cached --quiet && exit 1
          git commit -m "V9 paper original prestart BTC ETH SOL next4H color (no order)"
          python3 - <<'PY'
          import json,glob,time,datetime
          for p in glob.glob("forward/v9_next_4h_color/paper_forecasts/*.json"):
            j=json.load(open(p))
            T=datetime.datetime.fromisoformat(j["target4HStartUTC"].replace("Z","+00:00")).timestamp()
            if T>time.time():
              assert time.time()<T-180,"PUSH_TOO_LATE_TO_ATTEST_BEFORE_CANDLE_START"
          PY
          git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111
      - name: Score any PRIOR fully closed 4H prediction, preserve original commits
        if: steps.window.outputs.capture == 'true'
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.SOL_V8_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
        run: |
          python3 -u v9_next4h_paper_outcome_score.py
          python3 - <<'PY'
          import json
          j=json.load(open("forward/v9_next_4h_color/paper_scoreboard.json"))
          assert j["status"]=="V9_FORWARD_PAPER_SCOREBOARD_RESEARCH_ONLY"
          assert j["mustKeepAllForecastsEvenIfWrong"] is True
          assert j["realOrders"] is False and j["productionModified"] is False
          assert j["completedTargetForecasts"]<=j["totalPriorTargetForecasts"]
          print("V9_FORWARD_GREEN_RED_LEDGER_SCORED",j["completedTargetForecasts"])
          PY
      - name: Publish separate outcome files and true forward scoreboard
        if: steps.window.outputs.capture == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add forward/v9_next_4h_color/paper_scoreboard.json
          if [ -d forward/v9_next_4h_color/paper_outcomes ]; then
            git add --all -- forward/v9_next_4h_color/paper_outcomes/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "V9 paper: actual next4H own candle color after close, separate sealed outcome"
            git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111
          fi
      - name: Preserve audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-paper-journal-${{ github.run_id }}
          path: |
            forward/v9_next_4h_color/paper_forecasts/
            forward/v9_next_4h_color/paper_outcomes/
            forward/v9_next_4h_color/paper_scoreboard.json
          if-no-files-found: ignore
          retention-days: 60
