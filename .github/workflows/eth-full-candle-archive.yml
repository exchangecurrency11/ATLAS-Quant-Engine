name: ETH Full Binance Futures Klines Archive (research only)

on:
  push:
    branches:
      - experiment/v7-signal-quality-20261103
    paths:
      - eth_archive_pipeline.py
      - tests/test_eth_archive_pipeline.py
      - .github/workflows/eth-full-candle-archive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eth-full-archive-experiment
  cancel-in-progress: false

jobs:
  archive-eth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v5
        with:
          ref: experiment/v7-signal-quality-20261103
          persist-credentials: true

      - name: Run ETH archive safeguards tests
        run: python3 -m unittest discover -s tests -p 'test_eth_archive_pipeline.py' -v

      - name: Fetch SHA256 verified Binance ETHUSDT perpetual OHLCV archives
        run: |
          set -euo pipefail
          python3 eth_archive_pipeline.py \
            --start-month 2019-12 \
            --workers 8 \
            --output-dir forward/eth/archive
          test -s forward/eth/archive/manifest.json
          test -s forward/eth/archive/ETHUSDT_1h.json
          test -s forward/eth/archive/ETHUSDT_4h.json
          test -s forward/eth/archive/ETHUSDT_1d.json

      - name: Preserve historical ETH candles as downloadable research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-binance-verified-closed-klines-${{ github.run_id }}
          path: |
            forward/eth/archive/ETHUSDT_*.json
            forward/eth/archive/manifest.json
            forward/eth/archive/STATUS.md
          if-no-files-found: ignore
          compression-level: 7
          retention-days: 90

      - name: Commit small manifest and status ONLY to research branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/eth/archive/manifest.json forward/eth/archive/STATUS.md
          if git diff --cached --quiet; then
            echo 'No manifest changes'
            exit 0
          fi
          git commit -m 'ETH archive: verified Binance perpetual historical candle manifest'
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v7-signal-quality-20261103
            if git push origin HEAD:experiment/v7-signal-quality-20261103; then
              echo 'ETH research manifest persisted to experiment only'
              exit 0
            fi
            sleep 5
          done
          exit 1
