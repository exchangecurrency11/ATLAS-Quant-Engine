name: 'V9 BTC ETH SOL separate Daily 4H close commentary research'

# Produces Daily + 4H commentary, NOT the next 4H pre-start prediction.
# Check exact ETH 4H source readiness BEFORE reading BTC/SOL/structure.
# Independent ETH hourly publication can lag or be missing; a successful
# unrelated market-data workflow is NOT proof the ETH snapshot exists.
# Missing source means defer until a later trigger, never infer ETH data.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-scheduled-verified-daily-4h-commentary.yml'
  schedule:
    - cron: '32,47 0,4,8,12,16,20 * * *'
    # Independent retry in the following UTC hour; no historical backfill.
    - cron: '12,42 1,5,9,13,17,21 * * *'
  workflow_run:
    workflows:
      - ETH V7 Independent Hourly Paper Forward (no orders)
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v9-daily-4h-commentary-only
  cancel-in-progress: false

jobs:
  commentary:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research-only V9 commentary branch
        uses: actions/checkout@v5
        with:
          ref: research/v9-prestart-live-data-compatibility-20261111
          persist-credentials: true

      - name: Gate latest closed 4H and skip already sealed hour
        id: retry_gate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,pathlib
          now=datetime.datetime.now(datetime.timezone.utc)
          end=now.replace(hour=(now.hour//4)*4,minute=0,second=0,microsecond=0)
          age=(now-end).total_seconds()
          token=end.strftime("%Y-%m-%dT%H-00Z")
          done=pathlib.Path("forward/v9_close_commentary/history")/(token+".json")
          ok=600<=age<4*3600 and not done.exists()
          print("capture="+("true" if ok else "false"))
          print("target="+token)
          print("reason="+("ELIGIBLE_NEW_LATEST_4H" if ok else "ALREADY_SEALED_OR_NOT_FRESH"))
          PY

      - name: Require exact VERIFIED ETH 4H-close evidence before building report
        id: eth_ready
        if: steps.retry_gate.outputs.capture == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.retry_gate.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p forward/v9_close_commentary/input
          file="forward/v9_close_commentary/input/eth.json"
          # An ETH observation for the same EXACT 4H closing hour must
          # already have been committed; never substitute a later hour or
          # claim market-data workflow success means ETH was ready.
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/forward/eth/snapshots/$TARGET.json?ref=experiment/v7-signal-quality-20261103" --jq '.content' > "$file.b64" 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=4H ETH source pending::No independently sealed ETH snapshot for $TARGET yet; safe skip, future ETH/scheduled retry will recheck."
            echo "4H_CONTEXT_DEFERRED_MISSING_ETH_SAME_CLOSE $TARGET" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! base64 --decode "$file.b64" > "$file"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=4H ETH source invalid::ETH blob was not valid base64; no report generated."
            echo "4H_CONTEXT_DEFERRED_INVALID_ETH_BLOB $TARGET" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! python3 - <<'PY'
          import json,os,datetime
          path="forward/v9_close_commentary/input/eth.json"
          d=json.load(open(path))
          target=os.environ["TARGET"]
          hour=datetime.datetime.strptime(target,"%Y-%m-%dT%H-00Z").replace(tzinfo=datetime.timezone.utc)
          expected=hour.strftime("%Y-%m-%dT%H:%M:%SZ")
          assert d.get("status")=="VERIFIED_PAPER_OBSERVATION", "ETH_SOURCE_NOT_VERIFIED"
          assert d.get("targetClosed1HUTC")==expected, "ETH_4H_TARGET_HOUR_MISMATCH"
          assert d.get("brokerOrders") is False, "ETH_SOURCE_NOT_PAPER_ONLY"
          assert d.get("symbol")=="ETHUSDT_PERP.A", "ETH_SYMBOL_NOT_EXPECTED"
          PY
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=4H ETH source not verified::ETH exact-hour record failed validation; do not create commentary."
            echo "4H_CONTEXT_DEFERRED_UNVERIFIED_ETH $TARGET" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "4H_ETH_VERIFIED_AND_READY $TARGET"

      - name: Revalidate as-of time, indicator and no future data tests
        if: steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/v9-prestart-live-data-compatibility-20261111"
          python3 -m unittest discover -s tests -p 'test_v9_daily_4h_close_commentary.py' -q

      - name: Pull main BTC SOL and ETH independent read-only verified close sources
        if: steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forward/v9_close_commentary/input
          gh api "repos/$GITHUB_REPOSITORY/contents/market_data.json?ref=main" \
            --jq '.content' | base64 --decode > forward/v9_close_commentary/input/main.json
          gh api "repos/$GITHUB_REPOSITORY/contents/market_structure_data.json?ref=main" \
            --jq '.content' | base64 --decode > forward/v9_close_commentary/input/structure.json
          TIME=$(python3 - <<'PY'
          import json,datetime
          d=json.load(open('forward/v9_close_commentary/input/main.json'))
          assert d.get('ok') is True
          now=datetime.datetime.now(datetime.timezone.utc)
          checked=datetime.datetime.fromisoformat(d['checkedAtUTC'].replace('Z','+00:00'))
          assert -60<=(now-checked).total_seconds()<=2700,'MAIN_PROVIDER_STALE'
          r=next(x for x in d['results'] if x['symbol']=='BTCUSDT_PERP.A' and x['interval']=='4hour')
          t=datetime.datetime.fromisoformat(r['closeTimeUTC'].replace('Z','+00:00'))
          expected=now.replace(hour=(now.hour//4)*4,minute=0,second=0,microsecond=0)
          assert t==expected,f'LAST_4H_NOT_LATEST_CLOSED:{t} != {expected}'
          print(t.strftime('%Y-%m-%dT%H-00Z'))
          PY
          )
          # The source was already verified against the immutable target at
          # the eth_ready gate and is reused here without a second fetch.
          test -s forward/v9_close_commentary/input/eth.json

      - name: Generate BTC ETH SOL Daily + 4H close analysis independently of predicted color
        if: steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        run: |
          python3 -u v9_daily_4h_close_commentary.py \
            --main forward/v9_close_commentary/input/main.json \
            --eth forward/v9_close_commentary/input/eth.json \
            --structure forward/v9_close_commentary/input/structure.json

      - name: Attest matching candle times and append-only 4H interpretation history
        if: steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,datetime,pathlib,shutil
          base=pathlib.Path('forward/v9_close_commentary')
          x=json.loads((base/'latest.json').read_text())
          assert x['status']=='V9_VERIFIED_DAILY_4H_INTERPRETATIONS_ONLY'
          assert x['preservePreviousFrozen4HPreStartPredictions'] is True
          assert x['commentaryNotAnEntrySignal'] is True
          assert x['noRealOrders'] is True and x['productionModified'] is False
          assert set(x['assets'])=={'BTC','ETH','SOL'}
          now=datetime.datetime.now(datetime.timezone.utc)
          t=datetime.datetime.fromisoformat(x['asOf4HCloseUTC'].replace('Z','+00:00'))
          expected=now.replace(hour=(now.hour//4)*4,minute=0,second=0,microsecond=0)
          assert t==expected,'COMMENTARY_MUST_USE_LAST_COMPLETE_4H'
          token=t.strftime('%Y-%m-%dT%H-00Z')
          for ext in ('json','md'):
            dst=base/'history'/f'{token}.{ext}'
            dst.parent.mkdir(exist_ok=True,parents=True)
            if dst.exists():
              assert dst.read_bytes()==(base/f'latest.{ext}').read_bytes(), 'IMMUTABLE_CLOSE_COMMENTARY_CHANGED'
            else:
              shutil.copyfile(base/f'latest.{ext}',dst)
          print('V9_DAILY_4H_CONTEXT_SEALED',token)
          PY

      - name: Commit only interpretation reports to separate experimental branch
        if: steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v9_close_commentary/latest.json \
                  forward/v9_close_commentary/latest.md \
                  forward/v9_close_commentary/history/
          if git diff --cached --quiet; then
            echo "V9_NO_NEW_VERIFIED_CLOSE_COMMENTARY"
            exit 0
          fi
          git commit -m 'V9 separate BTC ETH SOL immutable verified Daily/4H close interpretation'
          for attempt in 1 2 3; do
            git pull --rebase origin research/v9-prestart-live-data-compatibility-20261111
            if git push origin HEAD:research/v9-prestart-live-data-compatibility-20261111; then
              echo "V9_CLOSE_CONTEXT_RESEARCH_PUBLISHED"
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Save separate Daily + 4H audit artifact
        if: always() && steps.retry_gate.outputs.capture == 'true' && steps.eth_ready.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v9-verified-close-context-${{ github.run_id }}
          path: |
            forward/v9_close_commentary/latest.json
            forward/v9_close_commentary/latest.md
          if-no-files-found: ignore
          retention-days: 45
