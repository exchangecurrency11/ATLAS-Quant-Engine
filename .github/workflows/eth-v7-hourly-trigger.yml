name: ETH V7 Independent Hourly Paper Forward (no orders)

# Main hosts GitHub scheduler. All analysis runs from the experiment branch.
# ETH-only Coinalyze API secret is optional; otherwise official Binance REST
# is attempted. HTTP 451 or invalid OHLCV => SOURCE_UNAVAILABLE_NO_SIGNAL.
# Manual post-secret connectivity smoke test; no trading permissions and no key logging.
on:
  schedule:
    - cron: '18,37,52 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/eth-v7-hourly-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eth-v7-independent-hourly-paper
  cancel-in-progress: false

jobs:
  eth-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard last closed UTC hour observation window
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          minute="$(date -u +%M)"
          if (( 10#$minute < 12 || 10#$minute > 58 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SCHEDULE_DELAY: no ETH live paper observation for this attempt"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "target=$(date -u +%Y-%m-%dT%H-00Z)" >> "$GITHUB_OUTPUT"
            echo "target_iso=$(date -u +%Y-%m-%dT%H:00:00Z)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ETH isolated experiment only
        if: steps.timing.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: experiment/v7-signal-quality-20261103
          persist-credentials: true

      - name: Run ETH and V7 unit tests
        if: steps.timing.outputs.run == 'true'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Query verified ETHUSDT perpetual 1H, 4H, Daily
        if: steps.timing.outputs.run == 'true'
        env:
          ETH_V7_COINALYZE_API_KEY: ${{ secrets.ETH_V7_COINALYZE_API_KEY || secrets.COINALYZE_API_KEY }}
          TARGET: ${{ steps.timing.outputs.target }}
          TARGET_ISO: ${{ steps.timing.outputs.target_iso }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forward/eth/snapshots forward/eth/reports forward/eth/tmp
          snapshot="forward/eth/snapshots/$TARGET.json"
          report="forward/eth/reports/$TARGET.md"
          if test -f "$snapshot" && grep -q '"status": "VERIFIED_PAPER_OBSERVATION"' "$snapshot"; then
            echo "An actual verified ETH paper observation already exists; preserve it."
            exit 0
          fi
          python3 eth_v7_hourly_observer.py \
            --target-utc "$TARGET_ISO" \
            --output "forward/eth/tmp/$TARGET.json" \
            --report "forward/eth/tmp/$TARGET.md"
          if test -f "$snapshot" && \
             grep -q '"status": "SOURCE_UNAVAILABLE_NO_SIGNAL"' "forward/eth/tmp/$TARGET.json"; then
            echo "Existing no-source evidence kept; no fictitious trade or signal."
          else
            mv "forward/eth/tmp/$TARGET.json" "$snapshot"
            mv "forward/eth/tmp/$TARGET.md" "$report"
          fi
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print("ETH_V7_ACTUAL_STATUS",p["status"],p["targetClosed1HUTC"])' "$snapshot"

      - name: Preserve independent ETH audit artifacts
        if: always() && steps.timing.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eth-v7-hourly-${{ github.run_id }}
          path: |
            forward/eth/tmp/*.json
            forward/eth/snapshots/*.json
            forward/eth/reports/*.md
          if-no-files-found: ignore
          retention-days: 20

      - name: Commit ONLY ETH experimental paper observation
        if: steps.timing.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/eth/snapshots/ forward/eth/reports/
          if git diff --cached --quiet; then
            echo "No new ETH observation to commit"
            exit 0
          fi
          git commit -m "ETH V7: independent hourly paper audit or explicit source refusal"
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v7-signal-quality-20261103
            if git push origin HEAD:experiment/v7-signal-quality-20261103; then
              echo "ETH paper audit persisted to isolated V7 experiment"
              exit 0
            fi
            sleep 5
          done
          echo "ETH paper audit persistence failed after 3 attempts" >&2
          exit 1


      # Audit files are uploaded and committed above even if the feed fails.
      # Only verified ETH 1H/4H/Daily evidence may make this job green.
      - name: Verify ETH snapshot health (fail closed)
        if: always() && steps.timing.outputs.run == 'true'
        shell: bash
        env:
          TARGET: ${{ steps.timing.outputs.target }}
          TARGET_ISO: ${{ steps.timing.outputs.target_iso }}
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import pathlib
          import string
          import sys
          from datetime import datetime, timezone

          target = os.environ["TARGET_ISO"]
          snapshot = pathlib.Path("forward/eth/snapshots") / (os.environ["TARGET"] + ".json")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          expected_symbol = "ETHUSDT_PERP.A"
          periods = {"1hour": 3600, "4hour": 14400, "daily": 86400}
          try:
              obj = json.loads(snapshot.read_text(encoding="utf-8"))
              if obj["status"] != "VERIFIED_PAPER_OBSERVATION":
                  raise ValueError("ETH_SOURCE_UNAVAILABLE")
              if obj["mode"] != "ETH_V7_INDEPENDENT_PAPER_FORWARD_NO_ORDERS":
                  raise ValueError("Unexpected ETH observer mode")
              if obj["symbol"] != expected_symbol or obj["targetClosed1HUTC"] != target:
                  raise ValueError("Wrong ETH symbol or stale hourly observation")
              if (obj["paperForwardObservation"] is not True
                  or obj["brokerOrders"] is not False
                  or obj["productionSystemModified"] is not False):
                  raise ValueError("ETH paper-only safety invariant violated")
              source = obj["dataSource"]
              if not isinstance(source, str) or not (
                  source.startswith("Coinalyze ETHUSDT_PERP.A / Binance perpetual")
                  or source.startswith("Binance official USD-M futures public GET")
              ):
                  raise ValueError("Unexpected ETH futures data source")
              target_s = int(datetime.fromisoformat(target.replace("Z", "+00:00")).timestamp())
              ctx = obj["marketContext"][expected_symbol]["timeframes"]
              hashes = obj["sourceSHA256"]
              if set(ctx) != set(periods) or set(hashes) != set(periods):
                  raise ValueError("Missing ETH 1H / 4H / Daily evidence")
              for tf, seconds in periods.items():
                  expected_close = datetime.fromtimestamp(
                      (target_s // seconds) * seconds, timezone.utc
                  ).strftime("%Y-%m-%dT%H:%M:%SZ")
                  if ctx[tf]["closeTimeUTC"] != expected_close:
                      raise ValueError("ETH " + tf + " has a stale or unclosed candle")
                  candle = ctx[tf]["candle"]
                  if not all(isinstance(candle[k], (int, float)) and math.isfinite(candle[k])
                             for k in ("open", "high", "low", "close", "volume")):
                      raise ValueError("ETH " + tf + " OHLCV missing or invalid")
                  sha = hashes[tf]
                  if not isinstance(sha, str) or len(sha) != 64 or any(
                      c not in string.hexdigits for c in sha
                  ):
                      raise ValueError("ETH " + tf + " missing source hash")
              cross = obj["crossTimeframeOHLCVVerifiedLast5"]
              if cross.get("1H_matches_4H") != 5 or cross.get("1H_matches_daily") != 5:
                  raise ValueError("ETH timeframe OHLCV reconciliation failed")
          except (OSError, ValueError, KeyError, TypeError, AttributeError) as error:
              print("::error title=ETH V7 data health::Unverified ETH data; see saved snapshot and artifact")
              print("ETH_DATA_HEALTH_FAILED", type(error).__name__)
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### ETH V7 data health: FAILED\n\n"
                              "No signal is authorized. Check ETH audit artifact and "
                              "the SOURCE_UNAVAILABLE reason in the snapshot.\n")
              sys.exit(1)
          print("ETH_DATA_HEALTH_VERIFIED 1H 4H Daily; paper-only; 5/5 cross-timeframe checks")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### ETH V7 data health: VERIFIED\n\n"
                          "1H, 4H and Daily futures candles checked. "
                          "5/5 cross-timeframe OHLCV comparisons passed. "
                          "Paper-only; no orders.\n")
          PY
