name: ATLAS E5D separated read-only observer and journal-only writer

# Two separate trust domains: the observation job cannot write the repo;
# the writer only validates JSON and appends to the isolated research branch.
on:
  push:
    branches: [main]
    paths: [.github/workflows/atlas-e5d-silent-hourly-observer.yml]
  schedule:
    # Backup clock ticks: GitHub schedules may be delayed or dropped.
    - cron: '43,56 * * * *'
  # Independent source-completion wake-ups; no upstream strategy edits.
  # Important: only successful DIRECT schedule/dispatch source jobs pass the
  # observe job gate below. Never chain a workflow_run cascade.
  workflow_run:
    workflows:
      - V9 Hourly BTC ETH SOL Market Context (paper only)
      - V9.2 selected SOL reversals independent forward paper 1000 USDT NO ALERTS
      - V9.2 ETH sealed hourly selected-pattern watch third shared paper NO ALERTS
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-e5d-hourly-append-only-journal
  cancel-in-progress: false

jobs:
  observe:
    # V9 is frequently launched by a SUCCESSFUL market-data workflow_run
    # rather than its independent cron; rejecting those missed verified hours.
    # Allow V9 two-hop chained wakeups (market data -> V9 -> observer) ONLY.
    # Still reject failed/cancelled source runs and chains from other sources.
    # No source code or archived snapshot is ever executed as a trade action.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.name == 'V9 Hourly BTC ETH SOL Market Context (paper only)'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout audited research source without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: research/atlas-core-v8b-journal-audit-20261115
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact approved source and E5D security tests
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/atlas-core-v8b-journal-audit-20261115
          test "$(git hash-object research/atlas_core_v8/hourly_journal_e5d.py)" = daa050e3f369976debe207da16cbbbd48edfd393
          test "$(git hash-object research/atlas_core_v8/test_hourly_journal_e5d.py)" = 1049513820ec021b1eeed9deca3f57e3d7f81255
          test "$(git hash-object research/atlas_core_v7/hourly_cold_observer_e5c.py)" = 1e48bbe996f2b9361b723e3d4728d45f23bc3675
          test "$(git hash-object research/atlas_core_v5/shadow_decision_e5.py)" = ffd9233d728de8f2f06c52f1da8baf90eb95d998
          python3 -m unittest research.atlas_core_v8.test_hourly_journal_e5d -q
      - name: Read source Git-tree and produce local current-run checkpoint (READ permission)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -u -m research.atlas_core_v8.hourly_journal_e5d
      - name: Pack ONLY this run's append-intent with SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=json.loads(Path("research/atlas_core_v8/output/e5d_report.json").read_bytes())
          o=d["output"]
          assert d["mode"]=="ATLAS_CORE_E5D_APPEND_ONLY_POST_START_HOURLY_OBSERVATION_NO_LIVE_ENTRY"
          assert d["newLiveSignalCount"]==0
          assert d["automaticOrdersOrAlertsSent"] is False
          assert d["originalCryptoAutomationsChanged"] is False
          assert d["paperAccountStateReadOrModified"] is False
          assert d["userPositionsAccessed"] is False
          assert d["source"]["actualNewLiveOpportunityCount"]==0
          assert all(d["source"]["actionSafety"].values())
          assert o["status"] in (
              "SOURCE_HOURS_MISMATCH_FAIL_CLOSED",
              "SOURCE_HOUR_PRE_FIRST_SEEN_ACTIVATION_NOT_CREDITED",
              "SOURCE_HOUR_STALE_OVER_90MIN_NOT_CREDITED",
              "NEW_POST_ACTIVATION_HOURLY_SOURCE_OBSERVED_NOT_ENTRY",
              "EXISTING_IMMUTABLE_POST_ACTIVATION_OBSERVATION_NO_REWRITE")
          stage=Path("e5d_payload")
          stage.mkdir()
          files=[("attempt.json",o["checkpointPath"])]
          if o["newObservation"]:
              files.append(("observation.json",o["observationPath"]))
          receipt={"runId":os.environ["GITHUB_RUN_ID"],
                   "runAttempt":os.environ["GITHUB_RUN_ATTEMPT"],
                   "status":o["status"],
                   "newObservation":o["newObservation"],
                   "reusedObservation":o["reusedImmutableObservation"],
                   "observationFile":o["observationPath"],
                   "files":[]}
          for item,path in files:
              raw=Path(path).read_bytes()
              assert 0<len(raw)<200000
              x=json.loads(raw)
              assert x["stage"]=="RESEARCH_ONLY"
              (stage/item).write_bytes(raw)
              receipt["files"].append({
                  "name":item,"path":path,
                  "sha256":hashlib.sha256(raw).hexdigest()})
          (stage/"manifest.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("ATLAS_E5D_ONLY_CURRENT_RUN_SOURCE_EVIDENCE_PACKAGED")
          PY
      - name: Send only verified JSON intent to isolated writer job
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e5d-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5d_payload/
          retention-days: 2
          if-no-files-found: error
      - name: Store temporary read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e5d-source-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/atlas_core_v8/output/
          retention-days: 30
          if-no-files-found: ignore

  append:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout isolated research journal (no research code execution)
        uses: actions/checkout@v5
        with:
          ref: research/atlas-core-v8b-journal-audit-20261115
          fetch-depth: 0
          persist-credentials: true
      - name: Download only same-run JSON evidence
        uses: actions/download-artifact@v4
        with:
          name: atlas-e5d-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5d_payload/
      - name: Strict validate signatures schema timestamps and append new JSON ONLY
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/atlas-core-v8b-journal-audit-20261115
          python3 - <<'PY'
          import hashlib,json,os,re
          from datetime import datetime
          from pathlib import Path
          pay=Path("e5d_payload")
          m=json.loads((pay/"manifest.json").read_bytes())
          run=os.environ["GITHUB_RUN_ID"];attempt=os.environ["GITHUB_RUN_ATTEMPT"]
          assert m["runId"]==run and m["runAttempt"]==attempt
          files=m["files"]
          assert isinstance(files,list) and len(files) in (1,2)
          kinds={f["name"] for f in files}
          assert kinds==({"attempt.json","observation.json"} if m["newObservation"] else {"attempt.json"})
          assert {p.name for p in pay.iterdir()}==kinds|{"manifest.json"}
          assert all(x.is_file() and not x.is_symlink() for x in pay.iterdir())
          recorded={x["name"]:x["path"] for x in files}
          new=[]
          for f in files:
              name=f["name"];path=f["path"]
              assert isinstance(path,str) and path.startswith("forward/atlas_core_e5d_hourly/")
              if name=="attempt.json":
                  match=re.fullmatch(
                    r"forward/atlas_core_e5d_hourly/attempts/(20\d\d-\d\d-\d\d)/"
                    r"(\d\d-\d\d-\d\d)_run(\d+)_try(\d+)\.json",path)
                  assert match and match.group(3)==run and match.group(4)==attempt
                  datetime.strptime(match.group(1)+"T"+match.group(2)+"Z","%Y-%m-%dT%H-%M-%SZ")
              else:
                  match=re.fullmatch(
                    r"forward/atlas_core_e5d_hourly/observations/(20\d\d-\d\d-\d\d)/"
                    r"(\d\d-00Z)\.json",path)
                  assert match
                  datetime.strptime(match.group(1)+"T"+match.group(2),"%Y-%m-%dT%H-00Z")
              raw=(pay/name).read_bytes()
              assert 0<len(raw)<200000
              assert hashlib.sha256(raw).hexdigest()==f["sha256"]
              obj=json.loads(raw)
              assert obj["stage"]=="RESEARCH_ONLY"
              if name=="attempt.json":
                  assert obj["runId"]==run and obj["runAttempt"]==attempt
                  assert obj["classification"]=="E5D_HOURLY_CHECKPOINT_ONLY"
                  assert obj["admission"]==m["status"]
                  assert obj["newObservationWritten"] is m["newObservation"]
                  assert obj["existingObservationReused"] is m["reusedObservation"]
                  assert obj["observationFile"]==m["observationFile"]
                  assert obj["notARealTradingSignal"] and obj["noRealOrdersOrNotifications"]
                  assert obj["noSourceDataBackfilled"]
              else:
                  assert obj["classification"]=="READ_ONLY_PAPER_OBSERVATION"
                  assert obj["evidenceRunId"]==run and obj["evidenceRunAttempt"]==attempt
                  assert obj["notAnExchangeFill"] and obj["notAnEntryTimeTradeAlert"]
                  assert obj["noBrokerOrders"] and obj["noUserAlerts"]
                  assert obj["userMustNotTradeFromThisRecord"]
                  assert obj["notIndependentBinanceTruth"]
                  assert obj["historical51NotForward"] and obj["noRealAccountExposure"]
                  assert set(obj["sourceSHA256"])=={"BTC_SOL_V92","ETH_V92","V9_CONTEXT"}
                  assert obj["sourceClosedHourUTC"]>="2026-11-14T22:00:00Z"
                  assert obj["firstSeenUTC"]>=obj["sourceClosedHourUTC"]
                  dt=datetime.strptime(obj["sourceClosedHourUTC"],"%Y-%m-%dT%H:%M:%SZ")
                  assert dt.strftime("%Y-%m-%dT%H-00Z")==(
                      match.group(1)+"T"+match.group(2))
                  assert m["observationFile"]==path
              target=Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              try:
                  with target.open("xb") as fd:
                      fd.write(raw)
                  new.append(path)
              except FileExistsError:
                  assert target.read_bytes()==raw,"EXISTING_E5D_JOURNAL_WOULD_CHANGE"
          if m["reusedObservation"]:
              previously=Path(m["observationFile"])
              assert previously.is_file()
              p=json.loads(previously.read_bytes())
              assert p["classification"]=="READ_ONLY_PAPER_OBSERVATION"
              assert p["notAnExchangeFill"] is True
          Path("e5d_new_paths.txt").write_text("\n".join(new)+("\n" if new else ""))
          print("ATLAS_E5D_CURRENT_RUN_NEW_RESEARCH_JSON",len(new))
          PY
      - name: Stage ONLY new research additions, never modifications or deletions
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/atlas-core-v8b-journal-audit-20261115
          while IFS= read -r name; do
            test -n "$name"
            git add -- "$name"
          done < e5d_new_paths.txt
          python3 - <<'PY'
          import subprocess
          b=subprocess.check_output(["git","diff","--cached","--name-status","-z"])
          z=b.decode().split("\0")
          if z[-1]=="":z.pop()
          assert len(z)%2==0
          changes=[(z[i],z[i+1]) for i in range(0,len(z),2)]
          wanted=set(open("e5d_new_paths.txt").read().splitlines())
          assert set(x[1] for x in changes)==wanted
          assert all(status=="A" for status,path in changes),changes
          assert all(path.startswith("forward/atlas_core_e5d_hourly/") and
                     ("/attempts/" in path or "/observations/" in path) and
                     path.endswith(".json") for status,path in changes)
          assert len(changes)<=2
          print("ATLAS_E5D_STAGED_ONLY_ADD_STATUS",len(changes))
          PY
      - name: Commit only isolated first-seen journal JSON to research branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/atlas-core-v8b-journal-audit-20261115
          if [[ ! -s e5d_new_paths.txt ]]; then
              echo "ATLAS_E5D_REPEATED_IDENTICAL_JOURNAL_NO_COMMIT"
              exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "ATLAS E5D research-only verified append $GITHUB_RUN_ID"
          for n in 1 2 3; do
            git pull --rebase origin research/atlas-core-v8b-journal-audit-20261115
            if git push origin HEAD:research/atlas-core-v8b-journal-audit-20261115; then
              echo "ATLAS_E5D_JOURNAL_ADD_ONLY_SUCCESS"
              exit 0
            fi
            sleep 3
          done
          echo "ATLAS_E5D_JOURNAL_GIT_PERSISTENCE_FAILED"
          exit 1
