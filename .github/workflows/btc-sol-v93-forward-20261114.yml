name: BTC SOL prospective regime high-vol parallel shadow (RESEARCH ONLY)

# This workflow is branch-isolated. GitHub scheduled actions only use main;
# a push to research/btc_sol_v93_forward_refresh_marker.md is the trigger
# after the official monthly Binance SHA256 archive is published.
on:
  push:
    branches:
      - research/btc-sol-event-regime-forward-20261114
    paths:
      - btc_sol_v93_prospective_20261114.py
      - tests/test_btc_sol_v93_prospective_20261114.py
      - .github/workflows/btc-sol-v93-forward-20261114.yml
      - research/btc_sol_v93_forward_refresh_marker.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-sol-20261115-prospective-only-frozen-monthly
  cancel-in-progress: false

jobs:
  monthly-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout independent research only
        uses: actions/checkout@v5
        with:
          ref: research/btc-sol-event-regime-forward-20261114
          fetch-depth: 0

      - name: Proof of frozen setup, no lookahead and baseline parity tests
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/btc-sol-event-regime-forward-20261114
          python3 -m py_compile btc_sol_v93_prospective_20261114.py
          python3 -m unittest discover -s tests -p 'test_btc_sol_v93_prospective_20261114.py' -v
          python3 -m unittest discover -s tests -p 'test_btc_sol_v93_causal_regime_20261114.py' -q

      - name: SHA256 official complete month archive for frozen BTC and SOL
        run: |
          set -euo pipefail
          python3 -u btc_sol_v93_prospective_20261114.py

      - name: Verify all six-stream original V9.3 reference replays and future freeze
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("forward/btc_sol_v93_prospective_20261114")
          spec=json.loads((p/"frozen_spec.json").read_text())
          assert spec["freezeUTC"]=="2026-11-15T00:00:00Z"
          assert spec["freezeIsAfterHistoricalResearch"]
          assert spec["perSideStressBps"]==[9,25,50]
          assert all(len(v)==64 for v in spec["frozenEngineHashesSHA256"].values())
          assert spec["noBrokerOrders"] and spec["noUserNotifications"]
          assert spec["noProductionOrV7V92AccountEdits"] and spec["notAutomaticallyPromoted"]
          data=(p/"latest.json") if (p/"latest.json").exists() else (p/"preflight.json")
          d=json.loads(data.read_text())
          assert d["freezeUTC"]==spec["freezeUTC"]
          assert d["officialArchiveCount"]==len(d["officialArchiveSHA256"])
          assert d["existingSixStreamV93ReferenceParity"]
          assert d["independentNewFutureTradesOnly"] and d["noHistoricalTradesCredited"]
          assert d["unresolvedPositionsNotCountedAsClosed"]
          assert not d["productionOrExistingPaperWrites"] and not d["notifications"]
          assert not d["realOrders"] and not d["candidatePromotionApproved"]
          assert set(d["streams"])=={"BTCUSDT","SOLUSDT"}
          for coin,v in d["streams"].items():
            assert set(v["versions"])=={"V92_REFERENCE","HIGH_VOL_CANDIDATE"}
            for version,row in v["versions"].items():
              assert len(row["closedTrades"])==row["metric"]["25"]["trades"]
              assert row["metric"]["50"]["netR"]<=row["metric"]["25"]["netR"]
            if d["status"]=="BTC_SOL_PREFREEZE_PIPELINE_TEST_ONLY":
              assert v["deltaR25"] is None
              assert all(z["metric"]["25"]["trades"]==0
                         for z in v["versions"].values())
          assert (p/"comparison.md").stat().st_size>200
          print("BTC_SOL_SHA256_PARALLEL_FUTURE_FROZEN_BASELINE_PARITY_VERIFIED")
          PY

      - name: Commit only additive prospective research shadow output
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/btc-sol-event-regime-forward-20261114
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/btc_sol_v93_prospective_20261114/
          if git diff --cached --quiet; then
            echo "NO_NEW_COMPLETE_MONTH_PROSPECTIVE_DATA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Seal BTC SOL frozen post-Nov15 monthly shadow source and paired results"
          for attempt in 1 2 3; do
            git pull --rebase origin research/btc-sol-event-regime-forward-20261114
            if git push origin HEAD:research/btc-sol-event-regime-forward-20261114; then
              echo "BTC_SOL_FUTURE_RESEARCH_PERSISTED_PRODUCTION_UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
