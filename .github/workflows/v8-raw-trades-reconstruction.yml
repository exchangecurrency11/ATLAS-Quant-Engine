name: V8 Binance Oct28 Raw Trade Gap Repair and Historical Archive

on:
  push:
    branches:
      - experiment/early-signals-v1-20261022
    paths:
      - reconstruct_binance_oct28_raw_v8.py
      - tests/test_reconstruct_binance_oct28_raw_v8.py
      - .github/workflows/v8-raw-trades-reconstruction.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authentic-trade-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify Binance raw trade ZIP checksums and reconstruct 28 Oct 1H
        run: |
          python3 reconstruct_binance_oct28_raw_v8.py --probe-only
      - name: End probe
        run: echo "Reconstructed from actual official raw Futures trades, no interpolation"

  completed-history:
    needs: authentic-trade-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild official SHA256-confirmed 24 months
        run: |
          python3 download_binance_um_history.py \
            --start 2024-10 --end 2026-09 \
            --workers 4 --output-dir binance_2y
      - name: Append 33 days, with 28 Oct derived only from raw Binance Futures trades
        run: |
          python3 reconstruct_binance_oct28_raw_v8.py \
            --base-dir binance_2y \
            --output-dir binance_v8 --workers 4
          python3 - <<'PY'
          import json
          p=json.load(open("binance_v8/provenance_manifest.json"))
          assert p["gapFilledWithRealTrades"]
          assert p["interpolationOrSpotUsed"] is False
          assert p["endExclusiveUTC"]=="2026-11-03T00:00:00+00:00"
          assert len(p["fileProofs"])==66
          for s in ("BTCUSDT","SOLUSDT"):
              assert p["counts"][s]=={"1hour":18312,"4hour":4578,"daily":763}
          assert len(p["adjacentDayMethodCrosschecks"])==2
          print("ALL_ARCHIVE_INTEGRITY_CHECKS_PASS",p["counts"])
          PY
      - name: Replay unchanged original V4 paper method through Nov 2
        run: |
          python3 backtest_retest_long_v4.py \
            --hour binance_v8/history_1hour.json \
            --four binance_v8/history_4hour.json \
            --daily binance_v8/history_daily.json \
            --as-of 1793664000 \
            --split-utc 2026-04-01T00:00:00+00:00 \
            --output binance_v8/full_v8_paper.json
          python3 analyze_failure_patterns_v6.py \
            --input binance_v8/full_v8_paper.json \
            --output binance_v8/descriptive_forensics.json
      - name: Verify old Oct27 baseline has not drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41117088756 --repo "${{ github.repository }}" \
            --name btc-sol-oct27-forensics-v6 --dir baseline
          python3 - <<'PY'
          import json
          original=json.load(open("baseline/october_extended_paper.json"))
          current=json.load(open("binance_v8/full_v8_paper.json"))
          cutoff=1793145600
          for sym in ("BTCUSDT_PERP.A","SOLUSDT_PERP.A"):
              old=original["results"][sym]
              new=current["results"][sym]
              assert old["alerts"]==[x for x in new["alerts"] if x["knownUTC"]<=cutoff],sym
              assert old["trades"]==[x for x in new["trades"] if x["entryOpenUTC"]<cutoff],sym
              print("BASELINE_UNCHANGED",sym,len(old["alerts"]),len(old["trades"]))
          PY
      - name: Store verified historical datasets and full audit, no Git push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-sol-official-binance-verified-through-2026-11-02
          path: |
            binance_v8/history_1hour.json
            binance_v8/history_4hour.json
            binance_v8/history_daily.json
            binance_v8/provenance_manifest.json
            binance_v8/full_v8_paper.json
            binance_v8/descriptive_forensics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Confirm no production modifications
        run: echo "Trading, Cloudflare, main branch and user notification automations unchanged"
