name: V9.2 SOL paired prospective paper study (V9.1 control vs selected filter)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v92-sol-paired-prospective-paper.yml
  workflow_run:
    workflows:
      - V9.1 hourly V7 vs max4h retest prospective paper shadow NO ALERTS
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v92-sol-research-branch-writes
  cancel-in-progress: false

jobs:
  paired-forward-study:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V9.2 research branch only
        uses: actions/checkout@v5
        with:
          ref: research/v92-bull-bear-candle-invalidation-20261112
          fetch-depth: 0
          persist-credentials: true

      - name: Compile and test immutable capture, veto attribution, and paired paper ledger
        run: |
          set -euo pipefail
          python3 -m py_compile v92_prospective_selected.py v92_sol_paired_prospective.py
          python3 -m unittest discover -s tests -p 'test_v92_prospective_selected.py' -v
          python3 -m unittest discover -s tests -p 'test_v92_sol_paired_prospective.py' -v
          python3 -m unittest discover -s tests -p 'test_v92_selected_reversal_patterns.py' -q
          python3 -m unittest discover -s tests -p 'test_v92_multi_candle_invalidation.py' -q
          python3 -m unittest discover -s tests -p 'test_v91_prospective_retest.py' -q

      - name: Read ONLY pre-existing E5J-owned Git-sealed source hour
        id: sealed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/v92-bull-bear-candle-invalidation-20261112
          git pull --ff-only origin research/v92-bull-bear-candle-invalidation-20261112
          target="$(date -u +%Y-%m-%dT%H-00Z)"
          source="forward/v92_prospective_selected/hourly/$target.json"
          if [ ! -s "$source" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "V92_SOL_PAIRED_SOURCE_NOT_YET_SEALED_SAFE_SKIP"
            exit 0
          fi
          python3 - "$source" "$target" <<'PY'
          import datetime,json,subprocess,sys
          from pathlib import Path
          file=Path(sys.argv[1]); target=sys.argv[2]
          j=json.loads(file.read_text(encoding="utf-8"))
          expected=target.replace("-00Z",":00:00Z")
          assert j.get("mode")=="V92_SELECTED_CANDLE_IMMUTABLE_HOURLY_FORWARD_PAPER_ONLY"
          assert j.get("targetClosed1HUTC")==expected
          assert j.get("sourceVerifiedSameHour") is True
          assert j.get("sourceV7AndV91RecomputedExactMatch") is True
          assert j.get("noPastHourBackfill") is True
          assert j.get("noBrokerOrders") is True and j.get("noUserNotifications") is True
          assert set(j.get("assets",{}))=={"BTCUSDT","SOLUSDT"}
          observed=datetime.datetime.fromisoformat(j["capturedAtUTC"].replace("Z","+00:00"))
          now=datetime.datetime.now(datetime.timezone.utc)
          closed=datetime.datetime.fromisoformat(expected.replace("Z","+00:00"))
          assert closed<=observed<=now and now-closed<datetime.timedelta(hours=1)
          tracked=subprocess.check_output(["git","ls-files","-s","--",str(file)],text=True).strip().split()
          assert len(tracked)==4 and tracked[0]=="100644" and tracked[2]=="0" and tracked[3]==str(file)
          blob=subprocess.check_output(["git","hash-object",str(file)],text=True).strip()
          assert blob==tracked[1]
          print("V92_SOL_PAIRED_CONSUME_EXISTING_GIT_SEALED_HOUR_ONLY",target)
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Recompute paired V9.1 control and V9.2 filtered SOL accounts
        if: steps.sealed.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -u v92_sol_paired_prospective.py \
            --hourly forward/v92_prospective_selected/hourly \
            --json forward/v92_prospective_selected/paired_sol_account.json \
            --markdown forward/v92_prospective_selected/paired_sol_account.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("forward/v92_prospective_selected/paired_sol_account.json").read_text())
          assert x["status"]=="V92_SOL_PAIRED_PROSPECTIVE_PAPER_ONLY"
          assert x["noBrokerOrders"] and x["noUserNotifications"]
          assert x["noRetrospectiveBackfill"]
          assert set(x["arms"])=={"V91_UNFILTERED_CONTROL","V92_STAR_HARAMI_SWEEP_FILTER"}
          assert x["researchDecision"] in {
            "INSUFFICIENT_PROSPECTIVE_SAMPLE",
            "PROMISING_BUT_NOT_APPROVED_FOR_LIVE",
            "NO_CLEAR_ROBUST_IMPROVEMENT_DO_NOT_PROMOTE"}
          print("V92_SOL_PAIRED_ACCOUNT_VALIDATED",json.dumps({
            "hours":x["savedDistinctVerifiedHours"],
            "baselineTrades":x["arms"]["V91_UNFILTERED_CONTROL"]["trades"],
            "filteredTrades":x["arms"]["V92_STAR_HARAMI_SWEEP_FILTER"]["trades"],
            "vetoes":x["directRetestAudit"].get("directFilterVetoes",0),
            "decision":x["researchDecision"]}))
          PY

      - name: Commit ONLY paired SOL comparison report, never shared hourly sources
        if: steps.sealed.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = research/v92-bull-bear-candle-invalidation-20261112
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A secondary study cannot create or change the official V9.2 source.
          test -z "$(git status --porcelain -- forward/v92_prospective_selected/hourly)"
          test -z "$(git status --porcelain -- forward/v92_prospective_selected/third_paper_account.json forward/v92_prospective_selected/third_paper_account.md)"
          git add forward/v92_prospective_selected/paired_sol_account.json \
                  forward/v92_prospective_selected/paired_sol_account.md
          if git diff --cached --name-only | grep -Ev '^forward/v92_prospective_selected/paired_sol_account\.(json|md)$'; then
            echo "V92_SOL_PAIRED_UNAUTHORIZED_STAGE"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new paired comparison report changes; no commit."
            exit 0
          fi
          git commit -m "V9.2 SOL paired comparison report ONLY (no hourly source writes)"
          for attempt in 1 2 3; do
            git pull --rebase origin research/v92-bull-bear-candle-invalidation-20261112
            if git push origin HEAD:research/v92-bull-bear-candle-invalidation-20261112; then
              echo "V92_SOL_PAIRED_PROSPECTIVE_EVIDENCE_SEALED_NO_LIVE_CHANGES"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload temporary source evidence and paired report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v92-sol-paired-prospective-${{ github.run_id }}
          path: |
            forward/v92_prospective_selected/paired_sol_account.json
            forward/v92_prospective_selected/paired_sol_account.md
          if-no-files-found: ignore
          retention-days: 45

      - name: Summarize paper-only status
        if: always()
        run: |
          if test -s forward/v92_prospective_selected/paired_sol_account.md; then
            cat forward/v92_prospective_selected/paired_sol_account.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new paired result was produced. Missing/stale data is never backfilled." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "E5M paired research consumes only existing V9.2 Git-sealed hours, never produces them." >> "$GITHUB_STEP_SUMMARY"
          echo "No broker orders, user alerts, V7/V9.1 edits, or production changes." >> "$GITHUB_STEP_SUMMARY"
