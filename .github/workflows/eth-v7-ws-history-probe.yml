name: ETH Futures WebSocket API Historical Probe
on:
  push:
    branches:
      - experiment/v7-signal-quality-20261103
    paths:
      - eth_ws_history_probe.py
      - .github/workflows/eth-v7-ws-history-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: experiment/v7-signal-quality-20261103
      - name: Probe Binance Futures Websocket API history method
        run: python3 eth_ws_history_probe.py
