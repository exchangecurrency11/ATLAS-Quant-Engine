name: 'V9 V7 trade opportunity priority bridge CI (no alerts)'

on:
  push:
    branches: [research/v9-prestart-live-data-compatibility-20261111]
    paths:
      - v9_v7_trade_opportunity_bridge.py
      - tests/test_v9_v7_trade_opportunity_bridge.py
      - .github/workflows/v9-v7-trade-bridge-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate original V7 BOS/retest priority and V9 immutable preopen context only
        run: |
          python3 -m py_compile v9_v7_trade_opportunity_bridge.py
          python3 -m unittest discover -s tests -p 'test_v9_v7_trade_opportunity_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_v9_next4h_paper_outcome_score.py' -q
          python3 -m unittest discover -s tests -p 'test_v9_next4h_prestart_paper_capture.py' -q
