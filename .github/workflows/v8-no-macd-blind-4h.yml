name: V8 No MACD 4H blind replay BTC ETH SOL

on:
  push:
    branches: [experiment/v8-blind-4h-review-20261110]
    paths:
      - v8_4h_no_macd_ablation.py
      - tests/test_v8_4h_no_macd_ablation.py
      - .github/workflows/v8-no-macd-blind-4h.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read only isolated experiment branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Test MACD-free 4H direction invariants
        run: python3 -m unittest discover -s tests -p 'test_v8_4h_no_macd_ablation.py' -v

      - name: Compute frozen 15:00 direction and reveal 19:00 comparison
        run: python3 v8_4h_no_macd_ablation.py

      - name: Validate report is research-only and fully paired
        run: |
          python3 - <<'PY'
          import json
          p="forward/v8_blind4h/2026-11-10_no_macd_15-to-19-TSI.json"
          obj=json.load(open(p))
          assert obj["status"]=="VERIFIED_RETROSPECTIVE_MACD_EXCLUDED_PAPER_REVIEW"
          assert obj["directionHits"]==3 and obj["assessedAssets"]==3
          assert not obj["brokerOrders"] and not obj["realtimePrediction"] and not obj["liveTradingApproved"]
          assert obj["originalETH15RealTimeDataUnavailable"]
          assert all(r["MACDUsed"] is False and r["V7PaperEntryAt15"] is False for r in obj["coins"].values())
          print("FROZEN_NO_MACD_BLIND_REPLAY_VALIDATED")
          PY

      - name: Preserve report even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-no-macd-blind-4h-${{ github.run_id }}
          path: forward/v8_blind4h/2026-11-10_no_macd_15-to-19-TSI.json
          if-no-files-found: ignore
          retention-days: 45

      - name: Commit paper evidence on isolated branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/v8_blind4h/2026-11-10_no_macd_15-to-19-TSI.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8 paper: strict no-MACD 15 to 19 TSİ 4H comparison"
          for attempt in 1 2 3; do
            git pull --rebase origin experiment/v8-blind-4h-review-20261110
            if git push origin HEAD:experiment/v8-blind-4h-review-20261110; then
              echo "NO_MACD_4H_REPORT_SAVED"
              exit 0
            fi
            sleep 3
          done
          exit 1
